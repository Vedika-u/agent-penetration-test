[project]
name = "target-agent"
version = "0.1.0"
description = "Target agent under test for AgentPenetrationTest — a LangGraph-orchestrated, multi-tool assistant with persistent memory."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "langchain-ollama>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.5",
    "garak>=0.17.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/target_agent", "src/harness"]

[tool.pytest.ini_options]
pythonpath = ["src"]
